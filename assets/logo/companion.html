<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spiti / Porch</title><link rel="stylesheet" href="tokens.css"><link rel="icon" href="favicon.ico"><style>
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.45 var(--body)}main{max-width:1050px;margin:auto;padding:28px clamp(18px,4vw,48px) 56px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0002;padding-bottom:22px}header img{height:34px}header small{font-size:13px}
h1{font:400 clamp(38px,7vw,78px)/1.04 var(--display);letter-spacing:-.06em;margin:42px 0 26px}
.stage{display:grid;grid-template-columns:minmax(140px, .85fr) 1fr;border-radius:30px;overflow:hidden;background:white;border:1px solid #0001}
.portrait{display:grid;place-items:center;min-height:320px;background:var(--canvas);color:var(--pigment)}.portrait svg{width:min(70%,320px);display:block}.content{display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,5vw,55px)}
h2{font:400 clamp(29px,4vw,46px)/1.1 var(--display);letter-spacing:-.05em;margin:6px 0 10px}p{margin:0;color:#54545b}.role{font-size:13px}ul{padding:0;list-style:none}li{padding:10px 0;border-bottom:1px solid #0002}
button{font:inherit;padding:12px 17px;cursor:pointer;border-radius:16px;border:1px solid #0002;background:white;color:var(--ink);display:flex;align-items:center;gap:10px}button[aria-pressed=true]{background:var(--ink);color:white}button:focus-visible{outline:3px solid #3d72bf;outline-offset:3px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button svg{width:33px;height:33px}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s linear infinite}.gaze{transition:transform 180ms ease-out}
@keyframes blink{0%,91%,95%,100%{transform:scaleY(1)}93%{transform:scaleY(.15)}}
@media(prefers-reduced-motion:reduce){.eyes{animation:none}.gaze{transition:none}}
@media(max-width:620px){.stage{grid-template-columns:1fr}.portrait{min-height:190px}.portrait svg{width:150px}main{padding-top:16px}h1{margin-top:24px}}
</style></head>
<body style="--canvas:#F76C42"><main><header><img src="lockup.svg" alt="Spiti"><small>Porch / Interactive study</small></header><h1>My home base</h1>
<div class="controls" role="group" aria-label="Face state"><button type="button" data-i="0" aria-pressed="true">Ready</button><button type="button" data-i="1" aria-pressed="false">Working</button><button type="button" data-i="2" aria-pressed="false">Complete</button></div><section class="stage"><div class="portrait"></div><div class="content" aria-live="polite"><span class="role">My Mac</span><h2></h2><p></p><ul></ul></div></section></main>
<script>const views=[["Home is ready", "Your Mac is connected.", ["Pottery class at 10", "Try the sea-green glaze"]], ["Focus session", "A quiet hour for the glaze study.", ["Focus timer running", "Pottery notebook open"]], ["Session complete", "The glaze study is wrapped up.", ["Focus timer finished", "Next up: lunch at noon"]]],faces=["<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><g transform=\"translate(0 0)\"><path d=\"M6 52 Q6 44 13 38 L45 11 Q52 5 60 11 L87 31 Q94 36 94 45 V75 Q94 89 81 90 H65 Q60 90 60 84 V79 Q60 70 53 70 Q46 70 46 79 V84 Q46 90 40 90 H21 Q6 90 6 76 Z\" fill=\"var(--ink)\"/><g class=\"gaze\"><g class=\"eyes\"><path d=\"M35.5 42 H35.5 Q40 42 40 46.5 V52.5 Q40 57 35.5 57 H35.5 Q31 57 31 52.5 V46.5 Q31 42 35.5 42ZM57.5 41 H57.5 Q62 41 62 45.5 V51.5 Q62 56 57.5 56 H57.5 Q53 56 53 51.5 V45.5 Q53 41 57.5 41Z\" fill=\"var(--canvas)\"/></g></g></g></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><g transform=\"translate(0 0)\"><path d=\"M6 52 Q6 44 13 38 L45 11 Q52 5 60 11 L87 31 Q94 36 94 45 V75 Q94 89 81 90 H65 Q60 90 60 84 V79 Q60 70 53 70 Q46 70 46 79 V84 Q46 90 40 90 H21 Q6 90 6 76 Z\" fill=\"var(--ink)\"/><g class=\"gaze\"><g class=\"eyes\"><path d=\"M33.325 49.35 H38.675 Q41 49.35 41 51.675000000000004 V51.675 Q41 54.0 38.675 54.0 H33.325 Q31 54.0 31 51.675 V51.675000000000004 Q31 49.35 33.325 49.35ZM55.325 47.4 H60.675 Q63 47.4 63 49.725 V49.724999999999994 Q63 52.05 60.675 52.05 H55.325 Q53 52.05 53 49.724999999999994 V49.725 Q53 47.4 55.325 47.4Z\" fill=\"var(--canvas)\"/></g></g></g></svg>", "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><g transform=\"translate(0 0)\"><path d=\"M6 52 Q6 44 13 38 L45 11 Q52 5 60 11 L87 31 Q94 36 94 45 V75 Q94 89 81 90 H65 Q60 90 60 84 V79 Q60 70 53 70 Q46 70 46 79 V84 Q46 90 40 90 H21 Q6 90 6 76 Z\" fill=\"var(--ink)\"/><g class=\"gaze\"><g class=\"eyes\"><path d=\"M30 53.25 Q34.5 37.65 39 53.25 L36.84 55.65 Q34.5 49.5 32.16 55.65ZM53 53.25 Q57.5 37.65 62 53.25 L59.84 55.65 Q57.5 49.5 55.16 55.65Z\" fill=\"var(--canvas)\"/></g></g></g></svg>"];
const stage=document.querySelector('.portrait'), buttons=[...document.querySelectorAll('button')], reduce=matchMedia('(prefers-reduced-motion: reduce)');
function show(i){const [title,info,items]=views[i];stage.innerHTML=faces[i];document.querySelector('h2').textContent=title;document.querySelector('p').textContent=info;document.querySelector('ul').replaceChildren(...items.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}
buttons.forEach((b,i)=>b.addEventListener('click',()=>show(i)));
function centre(){stage.querySelector('.gaze').removeAttribute('transform')}
stage.addEventListener('pointermove',e=>{if(reduce.matches)return;const box=stage.getBoundingClientRect();stage.querySelector('.gaze').setAttribute('transform','translate('+((e.clientX-box.left)/box.width-.5)*5+' '+((e.clientY-box.top)/box.height-.5)*4+')')});
stage.addEventListener('pointerleave',centre);reduce.addEventListener('change',centre);show(0);</script></body></html>
